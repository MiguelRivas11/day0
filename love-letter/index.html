<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Una experiencia premium para abrir una carta de amor interactiva.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Love Letter</title>
</head>
<body>
  <div class="app-shell">
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>

    <main class="stage" aria-label="Experiencia de carta de amor">
      <section class="hero-copy" aria-live="polite">
        <p class="eyebrow">Una detalle espacial para ti amor</p>
        <h1 class="hero-title">Abre con cuidado</h1>
        <p class="hero-subtitle">disfruta este momento especial</p>
      </section>

      <section class="envelope-scene" aria-label="Sobre interactivo">
        <button class="envelope-button" id="seal-button" type="button" aria-label="Romper sello del sobre">
          <div class="envelope" id="envelope">
            <div class="envelope-shadow"></div>
            <div class="envelope-body"></div>
            <div class="envelope-side envelope-side-left"></div>
            <div class="envelope-side envelope-side-right"></div>
            <div class="envelope-flap envelope-flap-back"></div>
            <div class="letter" id="letter">
              <div class="paper">
                <div class="paper-inner">
                  <p class="letter-kicker">Para ti</p>
                  <h2 class="letter-title">Mi chaparrita</h2>
                  <p class="letter-text" id="typed-text"></p>
                  <span class="typing-cursor" id="typing-cursor" aria-hidden="true"></span>
                </div>
              </div>
            </div>
            <div class="envelope-flap envelope-flap-front"></div>
            <div class="seal" id="seal" aria-hidden="true">
              <span class="seal-heart">❤</span>
            </div>
          </div>
        </button>

        <div class="microcopy" id="microcopy">Toca el corazón para abrir la carta</div>
      </section>

      <section class="final-scene" id="final-scene" aria-hidden="true">
        <button class="surprise-button" id="surprise-button" type="button">Un detalle mas ❤️</button>
        <div class="final-message" id="final-message">Te amo ❤️</div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
